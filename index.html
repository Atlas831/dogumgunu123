<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body { margin:0; font-family:Arial; text-align:center; background:#0b1d4d; color:white; }
  h1 { margin-top:20px; font-size:2.5em; }
  .container { display:flex; justify-content:center; align-items:center; margin:30px auto; }
  .cake { width:200px; cursor:pointer; margin:0 20px; }
  .icon { width:100px; }
  .flip { transform:scaleX(-1); }
  #badge { display:none; margin-top:20px; }
  #badge img { width:120px; }
  .gallery { display:none; margin-top:20px; }
  .gallery img { width:200px; margin:10px; border-radius:10px; cursor:pointer; }
  footer { margin-top:40px; padding:20px; background:rgba(0,0,0,0.5); color:white; }
  footer a { color:white; }
  form { margin-top:30px; }
  input { padding:10px; margin:5px; border-radius:5px; border:none; }
  button { padding:10px 20px; border:none; border-radius:5px; background:#1e3a8a; color:white; cursor:pointer; }
  #visitorList { display:none; margin-top:20px; background:rgba(255,255,255,0.1); padding:15px; border-radius:10px; }
  /* 3 nokta menü */
  #menu { display:none; position:absolute; top:10px; right:10px; }
  #menu button { background:none; border:none; color:white; font-size:24px; cursor:pointer; }
  #menuOptions { display:none; position:absolute; top:40px; right:10px; background:#1e3a8a; padding:10px; border-radius:5px; }
  #menuOptions a { display:block; color:white; text-decoration:none; margin:5px 0; cursor:pointer; }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>
  
  <div class="container">
    <img src="silah1.png" alt="Sol Silah" class="icon">
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake" onclick="cakeClick()">
    <img src="silah1.png" alt="Sağ Silah" class="icon flip">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4">
    <img src="SZRO1938.JPG" alt="Fotoğraf 5">
  </div>

  <!-- Kayıt Formu -->
  <form id="kayitForm" onsubmit="saveVisitor(event)">
    <h2>Kayıt Ol 📋</h2>
    <input type="text" id="isim" placeholder="İsim" required>
    <input type="text" id="soyisim" placeholder="Soyisim" required>
    <input type="text" id="dogumgunu" placeholder="Doğum Tarihi (GG/AA/YYYY)" required>
    <button type="submit">Kaydet</button>
  </form>
  <p id="kayitSonuc"></p>

  <!-- Ziyaretçi Listesi -->
  <div id="visitorList">
    <h2>Ziyaretçi Listesi 📋</h2>
    <ul id="list"></ul>
  </div>

  <!-- 3 Nokta Menü -->
  <div id="menu">
    <button onclick="toggleMenu()">⋮</button>
    <div id="menuOptions">
      <a onclick="showVisitors()">Ziyaretçi Göster</a>
      <a onclick="clearVisitors()">Erişimi Sil</a>
      <a onclick="banVisitor()">Banla</a>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Doğum günü çocuğu: Can Karagöz</p>
    <p>Doğum tarihi: 03/09/1988</p>
    <p>Tasarımcı & Yapımcı: Atlas Asil</p>
    <p>Mail: <a href="mailto:atmn2013atmn@gmail.com">atmn2013atmn@gmail.com</a></p>
  </footer>

  <script>
    let clickCount = 0;
    let specialVisitor = null;
    let userIP = null;
    let bannedIPs = [];

    // IP adresini al (ipify API)
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        userIP = data.ip;
        if(bannedIPs.includes(userIP)){
          document.body.innerHTML = "<h1>Banlandınız ❌</h1>";
        } else if(localStorage.getItem("registeredIP") === userIP){
          document.getElementById("kayitForm").style.display = "none";
          document.getElementById("kayitSonuc").innerText = "Zaten kayıtlısınız.";
        }
      });

    function cakeClick() {
      clickCount++;
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";

      if (clickCount === 5 && specialVisitor) {
        document.getElementById("visitorList").style.display = "block";
      }
    }

    function saveVisitor(event) {
      event.preventDefault();
      const isim = document.getElementById("isim").value.trim();
      const soyisim = document.getElementById("soyisim").value.trim();
      const dogumgunu = document.getElementById("dogumgunu").value.trim();

      document.getElementById("kayitSonuc").innerText =
        "Kayıt başarılı: " + isim + " " + soyisim;

      if(userIP){
        localStorage.setItem("registeredIP", userIP);
      }

      if (isim.toLowerCase() === "atlas" && soyisim.toLowerCase() === "asil") {
        specialVisitor = { isim, soyisim, dogumgunu };
        const li = document.createElement("li");
        li.innerText = isim + " " + soyisim + " - Doğum günü: " + dogumgunu;
        document.getElementById("list").appendChild(li);

        // Atlas Asil yetkili giriş → 3 nokta menü açılır
        document.getElementById("menu").style.display = "block";
      }

      document.getElementById("kayitForm").style.display = "none";
    }

    function toggleMenu(){
      const menuOptions = document.getElementById("menuOptions");
      menuOptions.style.display = menuOptions.style.display === "block" ? "none" : "block";
    }

    function showVisitors(){
      document.getElementById("visitorList").style.display = "block";
    }

    function clearVisitors(){
      document.getElementById("list").innerHTML = "";
    }

    function banVisitor(){
      if(userIP){
        bannedIPs.push(userIP);
        document.body.innerHTML = "<h1>Banlandınız ❌</h1>";
      }
    }
  </script>
</body>
</html>
