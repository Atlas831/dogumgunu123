<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d;
    color: white;
  }
  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }
  .nah {
    margin-top: 50px;
    width: 120px;
    cursor: pointer;
  }
  .container {
    display: none;
    justify-content: center;
    align-items: center;
    margin: 30px auto;
  }
  .cake {
    width: 200px;
    margin: 0 20px;
  }
  .icon {
    width: 100px;
  }
  .flip {
    transform: scaleX(-1);
  }
  #badge {
    display: none;
    margin-top: 20px;
  }
  #badge img {
    width: 120px;
  }
  .gallery {
    display: none;
    margin-top: 20px;
  }
  .gallery img {
    width: 200px;
    margin: 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  #messageBox {
    margin-top: 40px;
    font-size: 2em;
    font-weight: bold;
    min-height: 50px;
  }
  .fade-in {
    animation: fadeIn 1s ease-in forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>

  <!-- Nah işareti -->
  <img id="nahBtn" src="nah.jpg" alt="Nah İşareti" class="nah" onclick="showSurprise()">

  <!-- Pasta ve Silahlar -->
  <div class="container" id="cakeContainer">
    <img src="silah1.png" alt="Sol Silah" class="icon">
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake">
    <img src="silah1.png" alt="Sağ Silah" class="icon flip">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi (5. fotoğraf iptal) -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1" onclick="openModal(this.src)">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2" onclick="openModal(this.src)">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3" onclick="openModal(this.src)">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4" onclick="openModal(this.src)">
  </div>

  <!-- Mesajların çıkacağı alan -->
  <div id="messageBox"></div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>Doğum günü çocuğu: Can Karagöz</p>
    <p>Doğum tarihi: 03/09/1988</p>
    <p>Tasarımcı & Yapımcı: Atlas Asil</p>
    <p>Mail: <a href="mailto:atmn2013atmn@gmail.com">atmn2013atmn@gmail.com</a></p>
  </footer>

  <script>
    function showSurprise() {
      // Nah işaretini gizle
      document.getElementById("nahBtn").style.display = "none";

      // Pasta ve silahları göster
      document.getElementById("cakeContainer").style.display = "flex";

      // Rozet ve galeri aç
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";

      // Ses dosyasını çal
      var audio = new Audio("dogumgunu.mp3");
      audio.play();

      // Mesajları sırayla göster
      const messages = [
        "Can Karagöz",
        "Doğum günün",
        "Kutlu olsun 🎂"
      ];
      const box = document.getElementById("messageBox");
      box.innerHTML = ""; 
      let i = 0;

      function showNext() {
        if (i < messages.length) {
          const span = document.createElement("div");
          span.textContent = messages[i];
          span.classList.add("fade-in");
          box.appendChild(span);
          i++;
          setTimeout(showNext, 2000);
        }
      }

      showNext();
    }

    function openModal(src){
      document.getElementById("modalImg").src = src;
      document.getElementById("modal").style.display = "block";
    }

    function closeModal(){
      document.getElementById("modal").style.display = "none";
    }
  </script>
</body>
</html>
