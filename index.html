<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d;
    color: white;
  }
  h1 { margin-top: 20px; font-size: 2.5em; }
  .nah { margin-top: 50px; cursor: pointer; }
  .container { display: none; justify-content: center; align-items: center; margin: 30px auto; }
  .cake { margin: 0 20px; }
  .icon { }
  .flip { transform: scaleX(-1); }
  #badge { display: none; margin-top: 20px; }
  .gallery { display: none; margin-top: 20px; }
  .gallery img { margin: 10px; border-radius: 10px; cursor: pointer; }
  #messageBox { margin-top: 40px; font-weight: bold; min-height: 50px; }
  .fade-in { animation: fadeIn 1s ease-in forwards; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center; }
  #modal img { max-width:90%; max-height:90%; border:5px solid white; border-radius:10px; }

  /* 📱 Telefon dikey */
  @media screen and (max-width: 768px) and (orientation: portrait) {
    .nah { width: 220px; }
    .cake { width: 180px; }
    .icon { width: 80px; }
    .gallery img { width: 160px; }
    #messageBox { font-size: 1.5em; }
  }

  /* 📱 Telefon yatay */
  @media screen and (max-width: 768px) and (orientation: landscape) {
    .nah { width: 180px; }
    .cake { width: 150px; }
    .icon { width: 70px; }
    .gallery img { width: 140px; }
    #messageBox { font-size: 1.3em; }
  }

  /* 💻 PC normal */
  @media (min-width: 769px) {
    .nah { width: 200px; }
    .cake { width: 250px; }
    .icon { width: 120px; }
    .gallery img { width: 300px; }
    #messageBox { font-size: 2em; }
  }

  /* 💻 PC telefon modu (class eklenince) */
  body.phone-mode .nah { width: 220px; }
  body.phone-mode .cake { width: 180px; }
  body.phone-mode .icon { width: 80px; }
  body.phone-mode .gallery img { width: 160px; }
  body.phone-mode #messageBox { font-size: 1.5em; }

  /* Sağ alt köşedeki butonlar */
  #modeButtons {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #modeButtons button {
    display: flex;
    align-items: center;
    background: #333;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  #modeButtons button .icon {
    background: red;
    color: white;
    font-weight: bold;
    padding: 5px;
    margin-right: 8px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>

  <!-- Nah işareti -->
  <img id="nahBtn" src="nah.jpg" alt="Nah İşareti" class="nah">

  <!-- Pasta ve Silahlar -->
  <div class="container" id="cakeContainer">
    <img src="silah1.png" alt="Sol Silah" class="icon">
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake">
    <img src="silah1.png" alt="Sağ Silah" class="icon flip">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1" onclick="openModal(this.src)">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2" onclick="openModal(this.src)">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3" onclick="openModal(this.src)">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4" onclick="openModal(this.src)">
  </div>

  <!-- Mesajların çıkacağı alan -->
  <div id="messageBox"></div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>Doğum günü çocuğu: Can Karagöz</p>
    <p>Doğum tarihi: 03/09/1988</p>
    <p>Tasarımcı & Yapımcı: Atlas Asil</p>
    <p>Mail: <a href="mailto:atmn2013atmn@gmail.com">atmn2013atmn@gmail.com</a></p>
  </footer>

  <!-- Sağ alt köşedeki seçim butonları -->
  <div id="modeButtons">
    <button onclick="setNormalMode()"><span class="icon">💻</span> Normal Görünüm</button>
    <button onclick="setPhoneMode()"><span class="icon">📱</span> Telefon Görünümü</button>
  </div>

  <script>
    // Nah butonuna tıklama olayı
    document.getElementById("nahBtn").addEventListener("click", showSurprise);

    function showSurprise() {
      document.getElementById("nahBtn").style.display = "none";
      document.getElementById("cakeContainer").style.display = "flex";
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";

      var audio = new Audio("dogumgunu.mp3");
      audio.play();

      const messages = ["Can Karagöz","Doğum günün","Kutlu olsun 🎂"];
      const box = document.getElementById("messageBox");
      box.innerHTML = ""; 
      let i = 0;

      function showNext() {
        if (i < messages.length) {
          const span = document.createElement("div");
          span.textContent = messages[i];
          span.classList.add("fade-in");
          box.appendChild(span);
          i++;
          setTimeout(showNext, 2000);
        }
      }
      showNext();
    }

    function openModal(src){
      document.getElementById("modalImg").src = src;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal(){
      document.getElementById("modal").style.display = "none";
    }

    // Görünüm değiştirme
    function setNormalMode(){
      document.body.classList.remove("phone-mode");
    }
    function setPhoneMode(){
      document.body.classList.add("phone-mode");
    }
  </script>
</body>
</html>
