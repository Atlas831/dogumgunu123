<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d; /* Dark Blue */
    color: white;
  }
  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }
  .cake {
    width: 200px;
    cursor: pointer;
    margin: 30px auto;
    display: block;
  }
  #badge {
    display: none;
    margin-top: 20px;
  }
  #badge img {
    width: 120px;
  }
  .gallery {
    display: none;
    margin-top: 20px;
  }
  .gallery img {
    width: 200px;
    margin: 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>
  <img src="pasta.png" alt="Doğum Günü Pastası" class="cake" onclick="showSurprise()">

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4">
    <img src="SZRO1938.JPG" alt="Fotoğraf 5">
  </div>

  <script>
    function showSurprise() {
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";
    }
  </script>
</body>
</html>
