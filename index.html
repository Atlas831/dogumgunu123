<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d;
    color: white;
  }
  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }
  .nah {
    margin-top: 50px;
    width: 120px;
    cursor: pointer;
  }
  .container {
    display: none;
    justify-content: center;
    align-items: center;
    margin: 30px auto;
  }
  .cake {
    width: 200px;
    margin: 0 20px;
  }
  .icon {
    width: 100px;
  }
  .flip {
    transform: scaleX(-1);
  }
  #badge {
    display: none;
    margin-top: 20px;
  }
  #badge img {
    width: 120px;
  }
  .gallery {
    display: none;
    margin-top: 20px;
  }
  .gallery img {
    width: 200px;
    margin: 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  #messageBox {
    margin-top: 40px;
    font-size: 2em;
    font-weight: bold;
    min-height: 50px;
  }
  .fade-in {
    animation: fadeIn 1s ease-in forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }
  #modal img {
    max-width: 90%;
    max-height: 90%;
    border: 5px solid white;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>

  <!-- Nah işareti -->
  <img id="nahBtn" src="nah.jpg" alt="Nah İşareti" class="nah" onclick="showSurprise()">

  <!-- Pasta ve Silahlar -->
  <div class="container" id="cakeContainer">
    <img src="silah1.png" alt="Sol Silah" class="icon">
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake">
    <img src="silah1.png" alt="Sağ Silah" class="icon flip">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi (4 fotoğraf) -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1" onclick="openModal(this.src)">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2" onclick="openModal(this.src)">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3" onclick="openModal(this.src)">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4" onclick="openModal(this.src)">
  </div>

  <!-- Mesajların çıkacağı alan -->
  <div id="messageBox"></div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>Doğum günü çocuğu: Can Karagöz</p>
    <p>Doğum tarihi: 03/09/1988</p>
    <p>Tasarımcı & Yapımcı: Atlas
