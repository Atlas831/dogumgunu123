<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d; /* Dark Blue */
    color: white;
  }
  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px auto;
  }
  .cake {
    width: 200px;
    cursor: pointer;
    margin: 0 20px;
  }
  .icon {
    width: 100px;
  }
  .flip {
    transform: scaleX(-1); /* Sağdaki silahı ters çevirir */
  }
  #badge {
    display: none;
    margin-top: 20px;
  }
  #badge img {
    width: 120px;
  }
  .gallery {
    display: none;
    margin-top: 20px;
  }
  .gallery img {
    width: 200px;
    margin: 10px;
    border-radius: 10px;
    cursor: pointer; /* Tıklanabilir */
  }
  footer {
    margin-top:40px;
    padding:20px;
    background-color:rgba(0,0,0,0.5);
    color:white;
  }
  footer a {
    color:white;
  }
  /* Modal */
  #modal {
    display:none;
    position:fixed;
    z-index:1000;
    left:0; top:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
  }
  #modal img {
    margin:auto;
    display:block;
    max-width:90%;
    max-height:90%;
    margin-top:5%;
    border-radius:10px;
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>
  
  <div class="container">
    <!-- Sol silah -->
    <img src="silah1.png" alt="Sol Silah" class="icon">
    <!-- Pasta -->
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake" onclick="showSurprise()">
    <!-- Sağ silah (ayna efekti) -->
    <img src="silah1.png" alt="Sağ Silah" class="icon flip">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="AIND1279.JPG" alt="Fotoğraf 1" onclick="openModal(this.src)">
    <img src="AJMH7573.JPG" alt="Fotoğraf 2" onclick="openModal(this.src)">
    <img src="EWYI5911.JPG" alt="Fotoğraf 3" onclick="openModal(this.src)">
    <img src="JZYJ6508.JPG" alt="Fotoğraf 4" onclick="openModal(this.src)">
    <img src="SZRO1938.JPG" alt="Fotoğraf 5" onclick="openModal(this.src)">
  </div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>Doğum günü çocuğu: Can Karagöz</p>
    <p>Doğum tarihi: 03/09/1988</p>
    <p>Tasarımcı & Yapımcı: Atlas Asil</p>
    <p>Mail: <a href="mailto:atmn2013atmn@gmail.com">atmn2013atmn@gmail.com</a></p>
  </footer>

  <script>
    function showSurprise() {
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";
    }

    function openModal(src){
      document.getElementById("modalImg").src = src;
      document.getElementById("modal").style.display = "block";
    }

    function closeModal(){
      document.getElementById("modal").style.display = "none";
    }
  </script>
</body>
</html>
