<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esra Karagöz - Doğum Günü Sitesi</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, red, purple, blue);
      color: white;
    }
    h1 {
      margin-top: 20px;
      font-size: 2.5em;
    }
    .cake {
      width: 200px;
      cursor: pointer;
      margin: 30px auto;
      display: block;
    }
    .gallery {
      display: none;
      margin-top: 20px;
    }
    .gallery img {
      width: 150px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer; /* Fotoğraflar tıklanabilir */
    }
    #heartContainer {
      display: none;
      font-size: 40px;
      color: red;
      margin-top: 20px;
      line-height: 1.2;
    }
    footer {
      margin-top:40px;
      padding:20px;
      background-color:rgba(0,0,0,0.5);
      color:white;
    }
    footer a {
      color:white;
      text-decoration:none;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.8em; }
      .cake { width: 150px; }
      .gallery img { width: 100px; }
      #heartContainer { font-size: 25px; }
    }
    /* Modal */
    #modal {
      display:none;
      position:fixed;
      z-index:1000;
      left:0; top:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.8);
    }
    #modal img {
      margin:auto;
      display:block;
      max-width:90%;
      max-height:90%;
      margin-top:5%;
      border-radius:10px;
    }
  </style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Teyzeciğim Esra Karagöz 🎂</h1>
  <img src="pasta.png" alt="Doğum Günü Pastası" class="cake" onclick="showSurprise()">

  <!-- Kalplerden Büyük Kalp -->
  <div id="heartContainer">
    ❤️❤️__❤️❤️<br>
    ❤️❤️❤️❤️❤️❤️❤️<br>
    ❤️❤️❤️❤️❤️❤️❤️❤️❤️<br>
    ❤️❤️❤️❤️❤️❤️❤️<br>
    ❤️❤️❤️❤️❤️<br>
    ❤️❤️❤️<br>
    ❤️
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="IMG_2025075_103827.jpg" alt="Fotoğraf 1" onclick="openModal(this.src)">
    <img src="IMG_2025075_103824.jpg" alt="Fotoğraf 2" onclick="openModal(this.src)">
    <img src="IMG_2025075_103815.jpg" alt="Fotoğraf 3" onclick="openModal(this.src)">
    <img src="IMG_20250502_150858.jpg" alt="Fotoğraf 4" onclick="openModal(this.src)">
  </div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <!-- Footer -->
  <footer>
    <p>Tasarımcı & Yapımcı: Atlas Asil</p>
    <p>Ulaşım Bilgileri:</p>
    <p>Tel: <a href="tel:05010294900">05010294900</a></p>
    <p>Mail: <a href="mailto:atmn2013atmn@gmail.com">atmn2013atmn@gmail.com</a></p>
    <p>Made with ❤️ by Atlas</p>
  </footer>

  <script>
    function showSurprise() {
      document.getElementById("heartContainer").style.display = "block";
      document.getElementById("gallery").style.display = "block";
    }

    function openModal(src){
      document.getElementById("modalImg").src = src;
      document.getElementById("modal").style.display = "block";
    }

    function closeModal(){
      document.getElementById("modal").style.display = "none";
    }
  </script>
</body>
</html>
