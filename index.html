<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayımın Doğum Günü Sitesi</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #0b1d4d; /* Dark Blue */
    color: white;
  }
  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px auto;
  }
  .cake {
    width: 200px;
    cursor: pointer;
    margin: 0 20px;
  }
  .icon {
    width: 100px;
  }
  #badge {
    display: none;
    margin-top: 20px;
  }
  #badge img {
    width: 120px;
  }
  .gallery {
    display: none;
    margin-top: 20px;
  }
  .gallery img {
    width: 150px;
    margin: 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <h1>Doğum Günün Kutlu Olsun Dayıcığım 🎂</h1>
  
  <div class="container">
    <img src="silah.png" alt="Silah" class="icon">
    <img src="pasta.png" alt="Doğum Günü Pastası" class="cake" onclick="showSurprise()">
    <img src="silah.png" alt="Silah" class="icon">
  </div>

  <!-- Bekçi Rozeti -->
  <div id="badge">
    <img src="rozet.png" alt="Bekçi Rozeti">
  </div>

  <!-- Fotoğraf Galerisi -->
  <div class="gallery" id="gallery">
    <h2>Fotoğraflarımız 📸</h2>
    <img src="IMG_20250705_103827.jpg" alt="Fotoğraf 1">
    <img src="IMG_20250705_103824.jpg" alt="Fotoğraf 2">
    <img src="IMG_20250705_103815.jpg" alt="Fotoğraf 3">
    <img src="IMG_20250502_150858.jpg" alt="Fotoğraf 4">
    <img src="IMG_0277.jpg" alt="Fotoğraf 5">
    <img src="IMG_0195.jpg" alt="Fotoğraf 6">
  </div>

  <script>
    function showSurprise() {
      document.getElementById("badge").style.display = "block";
      document.getElementById("gallery").style.display = "block";
    }
  </script>
</body>
</html>
